[package]
name = "t3-kde-snap-shot"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-channel = "2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", features = ["blocking-api"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
